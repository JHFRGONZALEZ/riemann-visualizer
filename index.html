<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumas de Riemann — Visualizador Interactivo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#1a1a2e;color:#e2e8f0;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f0f23}
::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#e94560}
input[type="range"]{-webkit-appearance:none;appearance:none;height:6px;background:#0f3460;border-radius:3px;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#e94560;cursor:pointer}
select,input[type="number"],input[type="text"]{background:#0f3460;border:1px solid #1a4080;color:#e2e8f0;border-radius:6px;padding:8px 12px;font-size:14px;width:100%}
select:focus,input:focus{outline:none;border-color:#e94560}
button{cursor:pointer;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:#e94560;color:white}
.btn-primary:hover{background:#d63851}
.btn-secondary{background:#0f3460;color:#e2e8f0}
.btn-secondary:hover{background:#1a4080}
.btn-accent{background:#a855f7;color:white}
.btn-warning{background:#fbbf24;color:#000}
header{background:#16213e;border-bottom:1px solid #0f3460;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;color:#e94560;display:flex;align-items:center;gap:10px}
.examples-bar{background:rgba(22,33,62,.5);padding:8px 20px;border-bottom:1px solid rgba(15,52,96,.5);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.examples-bar span{color:#94a3b8;font-size:13px}
.examples-bar button{padding:4px 12px;font-size:12px;background:#0f3460;color:#e2e8f0}
.examples-bar button:hover{background:#e94560}
.main-layout{display:flex;flex-wrap:wrap;min-height:calc(100vh - 110px)}
aside{padding:16px;overflow-y:auto;max-height:calc(100vh - 110px)}
aside.left{width:300px;background:rgba(22,33,62,.7);border-right:1px solid rgba(15,52,96,.5)}
aside.right{width:420px;background:rgba(22,33,62,.7);border-left:1px solid rgba(15,52,96,.5)}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.section{margin-bottom:16px}
.section h3{font-size:13px;font-weight:700;color:#e94560;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.step-card{padding:12px;background:rgba(15,52,96,.3);border-radius:8px;margin-bottom:12px}
.step-card h4{font-size:11px;font-weight:700;color:#93c5fd;margin-bottom:8px}
.step-card p,.step-card div{font-size:13px;color:#cbd5e1;margin-bottom:4px}
.step-card.highlight{border:1px solid rgba(251,191,36,.3)}
.step-card.error{border:1px solid rgba(239,68,68,.3)}
.step-card.formula{background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3)}
.canvas-container{background:#0f0f23;border-radius:8px;border:1px solid #0f3460;overflow:hidden;position:relative}
.canvas-container canvas{width:100%;display:block}
.canvas-container .download-btn{position:absolute;top:8px;right:8px;padding:4px 10px;background:rgba(0,0,0,.6);color:white;font-size:11px;border-radius:4px;opacity:0;transition:opacity .2s}
.canvas-container:hover .download-btn{opacity:1}
.table-container{background:#0f0f23;border-radius:8px;border:1px solid #0f3460;padding:16px;overflow-x:auto}
.table-container h3{font-size:13px;font-weight:700;color:#e94560;margin-bottom:12px}
table{width:100%;font-size:11px;font-family:monospace;border-collapse:collapse}
th{padding:6px 8px;text-align:left;border-bottom:1px solid #0f3460;color:#94a3b8;font-weight:600}
td{padding:4px 8px;border-bottom:1px solid rgba(15,52,96,.3)}
tr:hover{background:rgba(15,52,96,.2)}
.radio-group{display:flex;flex-direction:column;gap:6px}
.radio-group label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#cbd5e1}
.radio-group label:hover{color:white}
.radio-group input[type="radio"]{accent-color:#e94560}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions-grid .full{grid-column:1/-1}
.n-buttons{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.n-buttons button{padding:4px 8px;font-size:11px}
.n-buttons button.active{background:#e94560}
.error-msg{margin-top:12px;padding:8px;background:rgba(127,29,29,.3);border:1px solid #b91c1c;border-radius:6px;font-size:12px;color:#fca5a5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#16213e;border:1px solid #0f3460;border-radius:12px;max-width:800px;width:100%;max-height:80vh;overflow-y:auto;padding:24px}
.modal h2{font-size:20px;color:#e94560;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:none;color:#94a3b8;font-size:20px;padding:0}
.modal section{margin-bottom:20px}
.modal section h3{font-weight:700;color:#93c5fd;margin-bottom:8px}
.modal section p{color:#cbd5e1;font-size:14px;line-height:1.6}
.modal .math-block{background:rgba(15,52,96,.5);padding:16px;border-radius:8px;text-align:center;margin:8px 0}
.visit-counter{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.visit-counter .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.checkbox-row input{accent-color:#e94560}
.checkbox-row label{font-size:12px;color:#94a3b8}
.fn-display{padding:8px;background:rgba(15,52,96,.5);border-radius:6px;text-align:center;margin-top:8px}
@media(max-width:1024px){
  aside.left,aside.right{width:100%;max-height:none;border:none;border-bottom:1px solid rgba(15,52,96,.5)}
  .main-layout{flex-direction:column}
}
</style>
</head>
<body>

<header>
  <h1><span style="font-size:24px">∫</span> Sumas de Riemann — Visualizador Interactivo</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="visit-counter">
      <span class="dot"></span>
      <span id="visitCount" style="font-family:monospace">...</span>
      <span style="color:#64748b">visitas</span>
    </div>
    <button class="btn-secondary" onclick="toggleHelp()">🎓 ¿Cómo funciona?</button>
  </div>
</header>

<div class="examples-bar">
  <span>Ejemplos:</span>
  <button onclick="loadExample(1)">x² en [0,2]</button>
  <button onclick="loadExample(2)">sin(x) en [0,π]</button>
  <button onclick="loadExample(3)">eˣ en [0,1]</button>
</div>

<div class="main-layout">
  <aside class="left">
    <div class="section">
      <h3>📐 Función</h3>
      <select id="fnSelect" onchange="changeFunction()">
        <option value="x2">f(x) = x²</option>
        <option value="x3-x">f(x) = x³ - x</option>
        <option value="sin">f(x) = sin(x)</option>
        <option value="exp">f(x) = eˣ</option>
        <option value="sqrt">f(x) = √x</option>
        <option value="1/x">f(x) = 1/x</option>
      </select>
      <div class="checkbox-row" style="margin-top:8px">
        <input type="checkbox" id="useCustom" onchange="toggleCustom()">
        <label for="useCustom">Función personalizada</label>
      </div>
      <input type="text" id="customFn" placeholder="Ej: x^2 + sin(x)" style="display:none" oninput="recalculate()">
      <div class="fn-display" id="fnDisplay"></div>
    </div>

    <div class="section">
      <h3>📏 Límites de Integración</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="font-size:11px;color:#94a3b8">a (inferior)</label>
          <input type="number" id="inputA" value="0" step="0.1" onchange="recalculate()">
        </div>
        <div>
          <label style="font-size:11px;color:#94a3b8">b (superior)</label>
          <input type="number" id="inputB" value="2" step="0.1" onchange="recalculate()">
        </div>
      </div>
      <div id="limitError" class="error-msg" style="display:none">⚠️ a debe ser menor que b</div>
    </div>

    <div class="section">
      <h3>🔢 Subintervalos (n)</h3>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="range" id="nSlider" min="1" max="200" value="4" style="flex:1" oninput="updateN(this.value)">
        <span id="nValue" style="font-size:18px;font-weight:700;color:#e94560;width:40px;text-align:center">4</span>
      </div>
      <div class="n-buttons">
        <button onclick="updateN(4)" class="active">n=4</button>
        <button onclick="updateN(10)">n=10</button>
        <button onclick="updateN(50)">n=50</button>
        <button onclick="updateN(100)">n=100</button>
        <button onclick="updateN(200)">n=200</button>
      </div>
    </div>

    <div class="section">
      <h3>📊 Tipo de Suma</h3>
      <div class="radio-group">
        <label><input type="radio" name="type" value="left" checked onchange="recalculate()"><span class="color-dot" style="background:#22c55e"></span>Izquierda</label>
        <label><input type="radio" name="type" value="right" onchange="recalculate()"><span class="color-dot" style="background:#f97316"></span>Derecha</label>
        <label><input type="radio" name="type" value="midpoint" onchange="recalculate()"><span class="color-dot" style="background:#a855f7"></span>Punto Medio</label>
        <label><input type="radio" name="type" value="upper" onchange="recalculate()"><span class="color-dot" style="background:#ef4444"></span>Superior (máx)</label>
        <label><input type="radio" name="type" value="lower" onchange="recalculate()"><span class="color-dot" style="background:#3b82f6"></span>Inferior (mín)</label>
      </div>
    </div>

    <div class="section">
      <h3>⚡ Acciones</h3>
      <div class="actions-grid">
        <button class="btn-primary" onclick="recalculate()">▶ Calcular</button>
        <button class="btn-secondary" id="animBtn" onclick="toggleAnimation()">🎬 Animar</button>
        <button class="btn-secondary" id="compareBtn" onclick="toggleCompare()">📊 Comparar</button>
        <button class="btn-secondary" id="exactBtn" onclick="toggleExact()">📐 Exacto</button>
        <button class="btn-secondary" onclick="downloadMainPNG()">🖼️ PNG Gráfico</button>
        <button class="btn-secondary" onclick="downloadTablePNG()">🖼️ PNG Tabla</button>
        <button class="btn-secondary full" onclick="exportTXT()">📥 Exportar TXT</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="canvas-container" id="mainCanvasContainer">
      <canvas id="mainCanvas" width="800" height="450"></canvas>
      <button class="download-btn" onclick="downloadMainPNG()">📥 PNG</button>
    </div>
    <div class="canvas-container">
      <canvas id="convCanvas" width="800" height="250"></canvas>
    </div>
    <div class="table-container" id="tableContainer" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">📈 Tabla de Convergencia</h3>
        <button class="btn-secondary" onclick="downloadTablePNG()" style="font-size:11px;padding:4px 10px">🖼️ PNG</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>n</th>
            <th style="text-align:right;color:#22c55e">S_izq</th>
            <th style="text-align:right;color:#f97316">S_der</th>
            <th style="text-align:right;color:#a855f7">S_med</th>
            <th style="text-align:right;color:#fbbf24">Error</th>
          </tr>
        </thead>
        <tbody id="convTableBody"></tbody>
      </table>
    </div>
  </main>

  <aside class="right" id="stepPanel">
    <h2 style="font-size:15px;font-weight:700;color:#e94560;border-bottom:1px solid #0f3460;padding-bottom:8px;margin-bottom:16px">📝 Desarrollo Paso a Paso</h2>
    <div id="stepContent"></div>
  </aside>
</div>

<div class="modal-overlay" id="helpModal" style="display:none" onclick="if(event.target===this)toggleHelp()">
  <div class="modal">
    <h2>🎓 ¿Cómo Funciona? <button onclick="toggleHelp()">✕</button></h2>
    <div id="helpContent"></div>
  </div>
</div>

<script>
const FUNCTIONS = {
  'x2': {
    label: 'f(x) = x²', latex: 'f(x) = x^2',
    fn: x => x*x,
    anti: x => x*x*x/3, antiLabel: 'F(x) = \\frac{x^3}{3}'
  },
  'x3-x': {
    label: 'f(x) = x³ - x', latex: 'f(x) = x^3 - x',
    fn: x => x*x*x - x,
    anti: x => x*x*x*x/4 - x*x/2, antiLabel: 'F(x) = \\frac{x^4}{4} - \\frac{x^2}{2}'
  },
  'sin': {
    label: 'f(x) = sin(x)', latex: 'f(x) = \\sin(x)',
    fn: x => Math.sin(x),
    anti: x => -Math.cos(x), antiLabel: 'F(x) = -\\cos(x)'
  },
  'exp': {
    label: 'f(x) = eˣ', latex: 'f(x) = e^x',
    fn: x => Math.exp(x),
    anti: x => Math.exp(x), antiLabel: 'F(x) = e^x'
  },
  'sqrt': {
    label: 'f(x) = √x', latex: 'f(x) = \\sqrt{x}',
    fn: x => Math.sqrt(Math.max(0,x)),
    anti: x => (2/3)*Math.pow(Math.max(0,x),1.5), antiLabel: 'F(x) = \\frac{2}{3}x^{3/2}'
  },
  '1/x': {
    label: 'f(x) = 1/x', latex: 'f(x) = \\frac{1}{x}',
    fn: x => x!==0 ? 1/x : Infinity,
    anti: x => Math.log(Math.abs(x)), antiLabel: 'F(x) = \\ln|x|'
  }
};

const TYPE_LABELS = {left:'Izquierda',right:'Derecha',midpoint:'Punto Medio',upper:'Superior',lower:'Inferior'};
const TYPE_COLORS = {left:'#22c55e',right:'#f97316',midpoint:'#a855f7',upper:'#ef4444',lower:'#3b82f6'};

let state = {
  fnKey: 'x2', customFn: '', useCustom: false,
  a: 0, b: 2, n: 4, type: 'left',
  showCompare: false, showExact: false, animating: false
};
let animId = null;
let result = null;
let exactValue = null;
let convData = [];

function getActiveFn() {
  if (state.useCustom) {
    try {
      const s = state.customFn.replace(/\^/g,'**').replace(/sin/g,'Math.sin').replace(/cos/g,'Math.cos').replace(/sqrt/g,'Math.sqrt').replace(/log/g,'Math.log').replace(/exp/g,'Math.exp').replace(/pi/g,'Math.PI');
      return new Function('x','return '+s);
    } catch { return x => x; }
  }
  return FUNCTIONS[state.fnKey].fn;
}

function computeRiemann(fn, a, b, n, type) {
  const dx = (b-a)/n;
  const points = [];
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const xL = a + i*dx, xR = xL + dx;
    let xStar, height;
    if (type === 'left') { xStar = xL; height = fn(xStar); }
    else if (type === 'right') { xStar = xR; height = fn(xStar); }
    else if (type === 'midpoint') { xStar = (xL+xR)/2; height = fn(xStar); }
    else if (type === 'upper') {
      let max = -Infinity;
      for (let s=0;s<=50;s++){const v=fn(xL+s/50*dx);if(isFinite(v)&&v>max)max=v;}
      height = max; xStar = (xL+xR)/2;
    } else {
      let min = Infinity;
      for (let s=0;s<=50;s++){const v=fn(xL+s/50*dx);if(isFinite(v)&&v<min)min=v;}
      height = min; xStar = (xL+xR)/2;
    }
    const area = height * dx;
    sum += area;
    points.push({i:i+1, x:xStar, fx:height, area, xLeft:xL, xRight:xR, height});
  }
  return {dx, sum, points};
}

function recalculate() {
  state.a = parseFloat(document.getElementById('inputA').value) || 0;
  state.b = parseFloat(document.getElementById('inputB').value) || 0;
  state.type = document.querySelector('input[name="type"]:checked').value;
  state.useCustom = document.getElementById('useCustom').checked;
  state.customFn = document.getElementById('customFn').value;

  if (state.a >= state.b) {
    document.getElementById('limitError').style.display = 'block';
    return;
  }
  document.getElementById('limitError').style.display = 'none';

  const fn = getActiveFn();
  result = computeRiemann(fn, state.a, state.b, state.n, state.type);

  const fnDef = FUNCTIONS[state.fnKey];
  exactValue = fnDef.anti(state.b) - fnDef.anti(state.a);

  const nVals = [1,2,4,8,10,16,20,32,50,64,100,128,200];
  convData = nVals.map(n => {
    const sL = computeRiemann(fn,state.a,state.b,n,'left').sum;
    const sR = computeRiemann(fn,state.a,state.b,n,'right').sum;
    const sM = computeRiemann(fn,state.a,state.b,n,'midpoint').sum;
    return {n, sLeft:sL, sRight:sR, sMid:sM, errorMid:Math.abs(sM-exactValue)};
  });

  updateDisplay();
}

function renderMath(tex, display=false) {
  try {
    return katex.renderToString(tex, {displayMode:display, throwOnError:false});
  } catch { return tex; }
}

function updateDisplay() {
  drawMainCanvas();
  drawConvCanvas();
  updateTable();
  updateStepByStep();
  updateFnDisplay();
}

function updateFnDisplay() {
  const el = document.getElementById('fnDisplay');
  if (state.useCustom) {
    el.innerHTML = renderMath('f(x) = ' + (state.customFn || '?'));
  } else {
    el.innerHTML = renderMath(FUNCTIONS[state.fnKey].latex);
  }
}
